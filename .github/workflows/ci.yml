name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      chroma:
        image: chromadb/chroma:1.5.9
        ports:
          - 8001:8000
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: food_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d food_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/food_ai_test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: food_ai_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET_KEY: ci-only-secret
      MIGRATION_CHECK_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Audit backend dependencies
        run: pip-audit -r requirements.txt
      - name: Lint backend
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check backend
        run: mypy app
      - name: Apply database migrations
        run: alembic -c app/alembic.ini upgrade head
      - name: Run backend tests
        run: python -m pytest -v --cov=app --cov-report=term --cov-fail-under=90
