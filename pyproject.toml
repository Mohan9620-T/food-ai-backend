[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    ".venv",
    "app/alembic/versions",
    "food-ai-ui",
    "pytest-cache-files-*",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "no_auto_verify: skip the autouse fixture that auto-verifies new test users' email, to exercise the real signup-OTP flow",
]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "app/alembic/versions/",
    "app/test_db.py",
]
