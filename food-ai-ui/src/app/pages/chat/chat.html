<div class="container">

    <h1>Food AI Chat</h1>

    <textarea
        [(ngModel)]="message"
        rows="6"
        placeholder="Ask something...">
    </textarea>

    <br>

    <button (click)="sendMessage()">

        Send

    </button>

    <br><br>

    <div *ngIf="loading">

        Thinking...

    </div>

    <div *ngIf="response">

        <h3>AI Response</h3>

        <p>{{response}}</p>

    </div>

</div>
