<div class="layout">

    @if (migrationNotice(); as notice) {
        <div class="migration-toast" role="status" aria-live="polite">
            <span>{{ notice }}</span>
            <button type="button" aria-label="Dismiss notification" (click)="clearMigrationNotice()">&times;</button>
        </div>
    }

    <app-sidebar></app-sidebar>

    <div class="chat-container">

        <app-chat-window></app-chat-window>

        <app-chat-input></app-chat-input>

    </div>

</div>
