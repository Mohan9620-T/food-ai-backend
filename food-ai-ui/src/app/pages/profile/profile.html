<div class="page-layout"><app-sidebar></app-sidebar><main><header><span>Personalization</span><h1>Nutrition Profile</h1><p>Your preferences guide meal suggestions. Nutrition values still come only from USDA data.</p></header>
@if(error){<div class="alert" role="alert">{{error}}</div>}@if(message){<div class="success" role="status">{{message}}</div>}
<form (ngSubmit)="save()"><label>Goal<select name="goal" [(ngModel)]="form.goal"><option value="lose_weight">Lose weight</option><option value="maintain">Maintain</option><option value="gain_weight">Gain weight</option></select></label>
<fieldset><legend>Optional daily targets</legend><label>Calories<input name="calories" type="number" min="1" [(ngModel)]="form.target_calories"></label><label>Protein (g)<input name="protein" type="number" min="0" [(ngModel)]="form.target_protein_g"></label><label>Carbs (g)<input name="carbs" type="number" min="0" [(ngModel)]="form.target_carbs_g"></label><label>Fat (g)<input name="fat" type="number" min="0" [(ngModel)]="form.target_fat_g"></label></fieldset>
<label>Allergies <small>Hard exclusions, comma-separated</small><input name="allergies" [(ngModel)]="allergies" placeholder="peanuts, shellfish"></label><label>Dietary restrictions <small>Hard exclusions</small><input name="restrictions" [(ngModel)]="restrictions" placeholder="vegetarian, halal"></label><label>Disliked foods <small>Soft exclusions</small><input name="dislikes" [(ngModel)]="dislikes" placeholder="mushrooms, olives"></label><button type="submit" [disabled]="loading()">{{loading()?'Saving…':'Save profile'}}</button></form>
</main></div>
