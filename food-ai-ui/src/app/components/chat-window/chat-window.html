<div #chatContainer class="chat-window" tabindex="-1" aria-label="Conversation messages">
  @if (messages().length === 0 && !isResponding()) {
    <section class="empty-state">
      <span class="empty-icon" aria-hidden="true">✦</span>
      <h1>How can I help?</h1>
      <p>Ask a question, paste code, or start exploring an idea.</p>
    </section>
  }
  @for (msg of messages(); track $index) {
    @if (msg.sender === 'user') {
    <div class="user-message-group">
      <div class="message user-message">{{ msg.text }}</div>
      <div class="message-actions">
        <button
          type="button"
          class="message-menu-button"
          (click)="toggleMessageMenu($index)"
          [disabled]="isResponding()"
          [attr.aria-expanded]="openMessageMenuIndex() === $index"
          aria-haspopup="menu"
          aria-label="Message actions">
          <span aria-hidden="true">&#8230;</span>
        </button>
        @if (openMessageMenuIndex() === $index) {
          <div class="message-menu" role="menu">
            <button type="button" role="menuitem" (click)="retryMessage($index)">
              Retry
            </button>
            <button type="button" role="menuitem" (click)="editMessage($index)">
              Edit
            </button>
          </div>
        }
      </div>
    </div>
    } @else {
    <div class="message bot-message markdown-body" [innerHTML]="renderMarkdown(msg.text)">
    </div>
    }
  }
  @if (isResponding()) {
    <div class="response-skeleton" role="status" aria-live="polite" aria-label="AI is preparing a response">
      <span></span><span></span><span></span>
    </div>
  }
</div>
