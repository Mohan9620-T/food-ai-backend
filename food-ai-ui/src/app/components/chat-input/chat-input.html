<div class="chat-input">
  <textarea
    #messageInput
    rows="1"
    [(ngModel)]="message"
    (input)="resizeInput($event)"
    (keydown)="handleKeydown($event)"
    [disabled]="isSending()"
    aria-label="Message"
    placeholder="Ask anything..."></textarea>

  <button type="button" (click)="sendMessage()" [disabled]="isSending()">
    {{ isSending() ? 'Sending...' : 'Send' }}
  </button>
</div>
