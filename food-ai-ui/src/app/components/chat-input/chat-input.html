<div class="chat-input">
  <textarea
    #messageInput
    rows="1"
    [(ngModel)]="message"
    (input)="resizeInput($event)"
    (keydown)="handleKeydown($event)"
    [disabled]="isSending()"
    aria-label="Message"
    placeholder="Ask anything..."></textarea>

  @if (isSending()) {
    <button
      type="button"
      class="stop-button"
      (click)="pauseResponse()"
      aria-label="Stop generating response"
      title="Stop generating">
      <span class="stop-icon" aria-hidden="true"></span>
    </button>
  } @else {
    @if (hasPausedResponse()) {
      <button type="button" class="continue-button" (click)="continueResponse()">
        Continue
      </button>
    }
    <button type="button" (click)="sendMessage()">
      {{ editingMessage() ? 'Update & Send' : 'Send' }}
    </button>
  }
</div>
