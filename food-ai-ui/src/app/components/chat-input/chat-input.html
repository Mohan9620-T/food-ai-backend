<div class="composer">
  @if (isDraggingImage) {
    <div class="image-drop-overlay" role="status" aria-live="polite">
      <div><span aria-hidden="true">&#128444;</span><strong>Drop image to attach</strong><small>JPEG, PNG, WebP, or GIF · maximum 8 MB</small></div>
    </div>
  }
  @if (imagePreviewUrl) {
    <div class="image-preview"><img [src]="imagePreviewUrl" alt="Selected image preview" /><div><strong>{{ selectedImage?.name }}</strong><small>Ready to analyze</small></div><button type="button" class="remove-image" (click)="removeImage()" aria-label="Remove attached image">&times;</button></div>
  }
  @if (imageError) { <div class="image-error" role="alert">{{ imageError }}</div> }
<div class="chat-input">
  <input #imagePicker class="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" (change)="selectImage($event)" />
  <button type="button" class="attach-button" (click)="imagePicker.click()" [disabled]="isSending()" aria-label="Attach image" title="Attach image"><span aria-hidden="true">&#128206;</span></button>
  <textarea
    #messageInput
    rows="1"
    [(ngModel)]="message"
    (input)="resizeInput($event)"
    (keydown)="handleKeydown($event)"
    aria-label="Message"
    placeholder="Ask anything..."></textarea>

  @if (isSending()) {
    <button
      type="button"
      class="stop-button"
      (click)="stopResponse()"
      aria-label="Stop generating response"
      title="Stop generating">
      <span class="stop-icon" aria-hidden="true"></span>
    </button>
  } @else {
    <button type="button" (click)="sendMessage()" aria-label="Send message">
      {{ editingMessage() ? 'Update & Send' : 'Send' }}
    </button>
  }
</div>
</div>
