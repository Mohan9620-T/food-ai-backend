repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --force-exclude
        language: python
        additional_dependencies: [ruff==0.16.6]
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: ruff format --check --force-exclude
        language: python
        additional_dependencies: [ruff==0.16.6]
        types: [python]

      - id: mypy
        name: MyPy type check
        entry: mypy app
        language: python
        additional_dependencies: [mypy==2.3.1]
        pass_filenames: false
        types: [python]
