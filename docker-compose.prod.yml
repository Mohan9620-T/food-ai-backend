services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-food_ai}
      POSTGRES_USER: ${DB_USER:-food_ai}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Optional chat-context cache, only used when ENABLE_REDIS_CACHE=true. No
  # published port: only the backend reaches it over the internal network.
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional semantic document retrieval index, only used when
  # ENABLE_SEMANTIC_RAG=true. No published port (internal network only) and
  # no in-container healthcheck - see docker-compose.yml for why; reachability
  # is verified from the backend's own /health/ready endpoint instead. Unlike
  # Redis's pure-cache semantics, losing this volume means real (if
  # recoverable-by-reindexing) data loss, so it is persisted.
  chroma:
    image: chromadb/chroma:1.5.9
    restart: always
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-food_ai}
      DB_USER: ${DB_USER:-food_ai}
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      APP_ENVIRONMENT: production
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      # Defaults reconciled with .env.example and verified live against the
      # NVIDIA NIM /v1/models catalog (see chat history) - the prior chat
      # default, deepseek-ai/deepseek-v4-pro-0813, does not exist there and
      # would have made every NVIDIA chat call fail on a fresh deployment.
      NVIDIA_CHAT_MODEL: ${NVIDIA_CHAT_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      NVIDIA_CHAT_VISION_MODEL: ${NVIDIA_CHAT_VISION_MODEL:-nvidia/nemotron-3-nano-omni-30b-a3b-reasoning}
      OLLAMA_URL: http://ollama:11434/api/chat
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:4b}
      OLLAMA_CHAT_VISION_MODEL: ${OLLAMA_CHAT_VISION_MODEL:-qwen3-vl:4b}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://example.com}
      MIGRATION_CHECK_ENABLED: "true"
      ENABLE_REDIS_CACHE: ${ENABLE_REDIS_CACHE:-false}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ENABLE_SEMANTIC_RAG: ${ENABLE_SEMANTIC_RAG:-false}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-nvidia}
    secrets:
      - db_password
      - jwt_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

secrets:
  db_password:
    file: ${DB_PASSWORD_FILE_PATH:-./secrets/db_password.txt}
  jwt_secret_key:
    file: ${JWT_SECRET_KEY_FILE_PATH:-./secrets/jwt_secret_key.txt}

volumes:
  postgres_data:
  ollama_models:
  chroma_data:
